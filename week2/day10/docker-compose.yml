version: "3.8"


services:
  news-app:
    image: manishk57107/news-app:v1
    ports:
      - "8081:8080"
    env_file: 
      - .env    
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
  

        
  nginx:
    image: "nginx:alpine"
    ports:
      - "80:80"
    depends_on:
        - news-app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
